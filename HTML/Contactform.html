<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SO PHONES KNOW THEY ARE PHONES -->

    <link rel="stylesheet" href="../CSS/HeaderFooter.css">
    <link rel="icon" href="../Content/img-logo/african-mask.png">
    <link rel="stylesheet" href="../CSS/Contactform.css">
    <link rel="stylesheet" type="text/css" href="../CSS/main.css">
    <title>Contact us</title>
</head>
<body>

    <nav id="header">
        <div id="logo">
            <a href="../index.html"><img src="../Content/img-logo/african-mask.png" alt="logo img" style="width: 2.5em; "></a>
        </div>
        <ul>
          <li><a href="../HTML/About.html">About us</a></li>
          <li><a href="../HTML/Contactform.html">Contact us</a></li>
        </ul>
    </nav>
  
    <div id="main-body">
        <div class="contact1">
            <div class="container-contact1">
                <div class="contact1-pic" data-tilt>
                  <img src="../Content/img-content/img-01.jpg" alt="Contact Image">
                </div>
      
                <form class="contact1-form validate-form">
                    <span class="contact1-form-title">
                        Get in touch
                    </span>
      
                    <div class="wrap-input1 validate-input" data-validate="Name is required">
                        <input class="input1" type="text" name="name" placeholder="Name">
                        <span class="shadow-input1"></span>
                    </div>
      
                    <div class="wrap-input1 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                        <input class="input1" type="text" name="email" placeholder="Email">
                        <span class="shadow-input1"></span>
                    </div>
      
                    <div class="wrap-input1 validate-input" data-validate="Subject is required">
                        <input class="input1" type="text" name="subject" placeholder="Subject">
                        <span class="shadow-input1"></span>
                    </div>
      
                    <div class="wrap-input1 validate-input" data-validate="Message is required">
                        <textarea class="input1" name="message" placeholder="Message"></textarea>
                        <span class="shadow-input1"></span>
                    </div>
      
                    <div class="container-contact1-form-btn">
                        <button class="contact1-form-btn">
                            <span>
                                Send Email
                                <i class="fa fa-long-arrow-right" aria-hidden="true"></i>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

  <div id="Footer">
    <div class="social-media">
      <ul>
        <li><a href=""><img src="../Content/img-ico/facebook.png" alt="Facebook">Facebook</a></li>
        <li><a href=""><img src="../Content/img-ico/instagram.png" alt="Instgram">Instgram</a></li>
        <li><a href=""><img src="../Content/img-ico/whatsapp.png" alt="WhatsApp">WhatsApp</a></li>
        <form method="post" action="" ></form>
        <li><a href=""><img src="../Content/img-ico/world-wide-web.png" alt="Email">Email</a></li>
        <li><a href="tel:12345678"><img src="../Content/img-ico/phone-call.png" alt="Email">+4412345678</a></li>
      </ul>
    </div>

    <div  id="secound-li">
      <ul>
        <li><a href="./Terms-page.html">Terms and Conditions</a></li>

        <li><a href="./Contactform.html">Contact us</a></li>
        <li>Copyright © [Year] Monate Gallery. All rights reserved.</li>
      </ul>
    </div>
  </div>
</body>
